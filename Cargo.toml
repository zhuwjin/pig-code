[package]
name = "nsh-app-pig-code-ts"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-engine = "0.4.0"
pig-core = { path = "crates/pig-core" }
pig-protocol = { path = "crates/pig-protocol" }
pig-provider = { path = "crates/pig-provider" }
pig-utils = { path = "crates/pig-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
portable-pty = "0.9"
alacritty_terminal = "0.26"
async-channel = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-testing = { version = "0.4.0", features = ["bundle"] }
