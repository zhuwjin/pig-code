[package]
name = "nsh-app-pig-code-ts"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
nsh-engine = "0.3.0"
pig-core = { path = "crates/pig-core" }
pig-protocol = { path = "crates/pig-protocol" }
pig-provider = { path = "crates/pig-provider" }
pig-utils = { path = "crates/pig-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = "0.3.0"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = "0.3.0"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = "0.3.0"

[dev-dependencies]
nsh-testing = { version = "0.3.0", features = ["bundle"] }
