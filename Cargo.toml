[package]
name = "nsh-app-pig-code-ts"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
nsh-core = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042" }
nsh-base = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042" }
nsh-engine = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042" }
pig-core = { path = "crates/pig-core" }
pig-protocol = { path = "crates/pig-protocol" }
pig-provider = { path = "crates/pig-provider" }
pig-utils = { path = "crates/pig-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
portable-pty = "0.9"
alacritty_terminal = "0.26"
async-channel = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042", default-features = false }

[dev-dependencies]
nsh-testing = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042", features = ["bundle"] }
nsh-bundler = { git = "https://github.com/zhuwjin/nsh", rev = "c4bce5bc29d2e79e70428e33c13cc1409bb58042" }
