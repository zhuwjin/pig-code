[package]
name = "nsh-app-pig-code"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["crates/*"]
resolver = "2"

[dependencies]
nsh-core = "0.7.1"
nsh-base = "0.7.1"
nsh-engine = "0.7.1"
pig-core = { path = "crates/pig-core" }
pig-daemon = { path = "crates/pig-daemon" }
pig-protocol = { path = "crates/pig-protocol" }
pig-provider = { path = "crates/pig-provider" }
pig-utils = { path = "crates/pig-utils" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
tracing = "0.1"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
portable-pty = "0.9"
async-channel = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false }

[dev-dependencies]
nsh-testing = { version = "0.7.1", features = ["bundle"] }
