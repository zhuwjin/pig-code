[package]
name = "pig-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
pig-core = { path = "../pig-core" }
pig-plugin-host = { path = "../pig-plugin-host" }
pig-protocol = { path = "../pig-protocol" }
pig-provider = { path = "../pig-provider" }
pig-utils = { path = "../pig-utils" }
async-channel = "2"
fs2 = "0.4"
futures-util = "0.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "sync"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
