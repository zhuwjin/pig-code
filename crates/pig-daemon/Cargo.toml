[package]
name = "pig-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
pig-core = { path = "../pig-core" }
pig-protocol = { path = "../pig-protocol" }
async-channel = "2"
fs2 = "0.4"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = "0.28"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pig-provider = { path = "../pig-provider" }
