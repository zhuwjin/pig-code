[package]
name = "pig-core"
version = "0.1.0"
edition = "2024"

[dependencies]
pig-protocol = { path = "../pig-protocol" }
async-channel = "2"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time"] }
tokio-util = "0.7"
time = { version = "0.3", features = ["local-offset"] }
toml = "0.8"
futures-util = "0.3"
similar = "2"
regex = "1"
glob = "0.3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
scraper = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }

# macOS 取访达真实图标（NSWorkspace）；已在 gpui 依赖树内，直引不增体积
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

# Windows 取资源管理器/Windows Terminal 真实应用图标；对齐 macOS 的 Finder 图标路径，已在依赖树内
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
