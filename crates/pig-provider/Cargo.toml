[package]
name = "pig-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
pig-protocol = { path = "../pig-protocol" }
encoding_rs = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"

# Unix: the kernel version via uname, for os.release() in the SDK user agent
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the system version via RtlGetVersion, for os.release() in the SDK user agent;
# windows-rs 0.57 keeps RtlGetVersion in the Wdk namespace and OSVERSIONINFOW in Win32
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
