      en: 'Full instructions of the skill: steps, constraints, examples; relative paths resolve against the skill directory, and the ${SKILL_DIR} placeholder is available'
    name_placeholder:
      zh-CN: 例如 commit-helper
      en: e.g. commit-helper
    when_to_use_placeholder:
      zh-CN: 可选：什么场景下用这个技能
      en: 'Optional: in which scenarios this skill should be used'
    default_body:
      zh-CN: "# 用途\n\n（这个技能做什么、怎么用）\n"
      en: "# Purpose\n\n(What this skill does and how to use it)\n"
    example:
      zh-CN: |
        ---
        name: commit-helper
        description: 按仓库惯例生成提交信息并提交
        when_to_use: 用户要求提交代码时
        ---

        # 提交助手

        1. 用 git diff 了解本次改动
        2. 按仓库现有提交风格写提交信息
        3. 用户确认后提交
      en: |
        ---
        name: commit-helper
        description: Generate a commit message following repo conventions and commit
        when_to_use: When the user asks to commit code
        ---

        # Commit helper

        1. Use git diff to review the changes
        2. Write the commit message in the repo's existing style
        3. Commit after user confirmation
