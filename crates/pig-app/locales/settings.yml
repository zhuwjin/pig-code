      en: 'Each skill is a directory containing SKILL.md (frontmatter sets name/description); project-level skills override same-named user-level skills:'
    effective_hint:
      zh-CN: 技能清单注入系统提示词（仅名称+描述，会话开始时冻结），正文由 Skill 工具按需加载；改动对新建会话生效。
      en: The skill list is injected into the system prompt (name + description only, frozen at session start); bodies load on demand via the Skill tool; changes apply to new sessions.
    edit_title:
      zh-CN: 编辑技能「%{name}」
      en: 'Edit skill "%{name}"'
    name_hint:
      zh-CN: 模型经 Skill 工具按名调用；编辑时不可改名（删除后重建），目录名取名称归一小写
      en: The model invokes the skill by name via the Skill tool; it cannot be renamed while editing (delete and recreate); the directory name is the normalized lowercase name
    field_description:
      zh-CN: 描述
      en: Description
    description_hint:
      zh-CN: 写进系统提示词的技能清单，说明这个技能做什么；建议一句话+适用边界
      en: Shown in the skill list injected into the system prompt, describing what the skill does; one sentence plus applicable boundaries recommended
    field_when_to_use:
      zh-CN: 适用场景（可选）
      en: When to use (optional)
    when_to_use_hint:
      zh-CN: when_to_use：什么情况下应该用这个技能，拼在清单描述后面
      en: 'when_to_use: in which cases this skill should be used, appended after the list description'
    field_body:
      zh-CN: 正文（SKILL.md body）
