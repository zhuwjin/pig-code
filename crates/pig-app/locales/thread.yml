    en: Rejected
  plan:
    zh-CN: 计划
    en: Plan
  tool_bash:
    zh-CN: 终端
    en: Terminal
  tool_read:
    zh-CN: 读取
    en: Read
  tool_write:
    zh-CN: 写入
    en: Write
  tool_edit:
    zh-CN: 编辑
    en: Edit
  tool_glob:
    zh-CN: 查找文件
    en: Find files
  tool_grep:
    zh-CN: 搜索
    en: Search
  tool_todo:
    zh-CN: 待办
    en: Todos
  tool_fetch:
    zh-CN: 抓取网页
    en: Fetch web page
  tool_bg_task:
    zh-CN: 后台任务
    en: Background task
  tool_ask:
    zh-CN: 提问
