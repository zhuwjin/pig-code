# 审批卡的高风险命令警示行（ApprovalRequested.danger_key → 静态映射，见 composer/aux_panel.rs）。
# high_risk 是标题（代码里拼 ⚠️ 前缀与 reason），其余六个是原因键（core bash.rs DangerReason.key）。
approval:
  danger:
    high_risk:
      zh-CN: 高风险命令
      en: High-risk command
    fork_bomb:
      zh-CN: fork 炸弹
      en: fork bomb
    rm_rf_root:
      zh-CN: rm -rf 指向根/家/当前目录
      en: rm -rf targeting the root, home, or current directory
    disk_format:
      zh-CN: 磁盘格式化/分区操作
      en: disk formatting/partitioning
    dd_block:
      zh-CN: dd 写入块设备
      en: dd writing to a block device
    shutdown:
      zh-CN: 关机/重启操作
      en: shutdown/reboot
    chmod_root:
      zh-CN: 递归改权/改属根目录
      en: recursive chmod/chown on /
