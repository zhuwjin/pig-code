_version: 2

# 输入区（composer*：placeholder/斜杠命令/执行模式/审批条/弹层/任务面板/问卷/图片附件）。
# 按钮尾部快捷键（如 "  Ctrl+⏎"）留在代码里拼接，不进文案。

composer:
  placeholder_idle:
    zh-CN: 向 Pig Code 提问，使用 @ 添加上下文，使用 / 选择命令
    en: Ask Pig Code anything — @ to add context, / for commands
