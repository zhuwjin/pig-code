[package]
name = "pig-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pig-code"
path = "src/main.rs"

[dependencies]
# tree-sitter*：代码语法高亮（Read 工具卡 / 右侧文件面板；顺带让 TextView
# Markdown 代码块获得高亮）。tree-sitter-languages = 全部内置语法包
gpui-kit = { version = "0.7", features = ["tree-sitter", "tree-sitter-languages"] }
pig-protocol = { path = "../pig-protocol" }
pig-core = { path = "../pig-core" }
pig-provider = { path = "../pig-provider" }
pig-utils = { path = "../pig-utils" }
async-channel = "2"
time = { version = "0.3", features = ["local-offset"] }
serde_json = "1"
rust-embed = "8"
# 语法高亮的 SyntaxHighlighter::update 以 ropey::Rope 为输入（版本对齐 gpui-component）
ropey = "=2.0.0-beta.1"
# 内嵌终端：PTY + VT 解析（参考 tty7，均走 crates.io，不碰 zed git 依赖红线）
portable-pty = "0.9"
alacritty_terminal = "0.26"
unicode-segmentation = "1"
# GUI 多语言（与 gpui-component 同款机制/版本）：注册表在 locales/，t! 取串
rust-i18n = "4.2"
# 「跟随系统」语言检测（macOS CFLocale / Windows API）
sys-locale = "0.3"
# 日志：tracing 门面 + subscriber 初始化（logging.rs）+ 按天滚动文件
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# unix 默认 shell 解析（getpwuid/access，与 portable-pty new_default_prog 同链）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
# 测试进程启动前钉 zh-CN（rust-i18n 默认 locale 是 en；ctor 仅测试用）
ctor = "1"
