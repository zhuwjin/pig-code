[package]
name = "pig-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
pig-daemon = { path = "../pig-daemon" }
pig-protocol = { path = "../pig-protocol" }
pig-utils = { path = "../pig-utils" }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
unicode-width = "0.2"

[dev-dependencies]
async-channel = "2"
pig-core = { path = "../pig-core" }
pig-provider = { path = "../pig-provider" }
portable-pty = "0.9"
serde_json = "1"
